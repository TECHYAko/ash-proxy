<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="shortcut icon" id="tab-favicon" href="/assets/media/favicon/ash.svg" />
  <title>Website Not Found | Ash Proxy</title>
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/ash.css" />
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/main.js"></script>
</head>
<body class="block-page">
  <div class="nav-bar"></div>
  <main class="block-card">
    <span class="block-mark" aria-hidden="true">A</span>
    <p class="catalogue-kicker">Address check</p>
    <h1>Website Not Found</h1>
    <p></p>
    <p></p>
    <a class="block-home-link" href="/home">Back to Ash</a>
  </main>
  <script>
    (function () {
      const hash = decodeURIComponent(location.hash.slice(1));
      let host = hash.slice(hash.indexOf("|") + 1);
      try {
        host = new URL(host).hostname || host;
      } catch {}
      const paragraphs = document.querySelectorAll("main p");
      if (paragraphs.length < 2) return;
      paragraphs[0].textContent = `${host || "This address"} could not be found.`;
      paragraphs[1].textContent = "The domain does not exist. Check the address for typos.";
    })();
  </script>
</body>
</html>
