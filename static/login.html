<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ash Proxy Login</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg) 65%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
      }

      .card {
        width: min(92vw, 440px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(2, 6, 23, 0.5);
        padding: 32px 24px 24px;
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.5rem);
        text-align: center;
      }

      p {
        margin: 0 0 22px;
        text-align: center;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #03101b;
        font-size: 1rem;
        font-weight: 700;
        padding: 13px 18px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .error {
        min-height: 22px;
        color: var(--danger);
        font-size: 0.95rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Ash Proxy</h1>
      <p>Enter the password to continue.</p>

      <form id="loginForm" method="post" autocomplete="off">
        <label>
          Password
          <input id="password" name="password" type="password" placeholder="Password" required />
        </label>
        <button type="submit">Unlock</button>
        <div id="error" class="error" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = passwordInput.value.trim();

        if (!password) {
          errorBox.textContent = 'Please enter a password.';
          return;
        }

        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });

          const payload = await response.json().catch(() => ({}));

          if (!response.ok || payload.ok !== true) {
            errorBox.textContent = payload.message || 'Incorrect password.';
            passwordInput.focus();
            return;
          }

          window.location.href = payload.redirectTo || '/';
        } catch (error) {
          errorBox.textContent = 'Unable to sign in right now. Please try again.';
        }
      });
    </script>
  </body>
</html>
