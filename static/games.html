<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="shortcut icon" id="tab-favicon" href="/assets/media/favicon/ash.svg" />
  <title id="page-title">Games | Ash Proxy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/container.css" />
  <link rel="stylesheet" href="/assets/css/nav.css" />
  <link rel="stylesheet" href="/assets/css/ash.css" />
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/main.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="catalogue-page games-page">
  <div class="nav-bar"></div>
  <main class="catalogue-shell">
    <header class="catalogue-heading">
      <div class="catalogue-heading-copy">
        <p class="catalogue-kicker">The arcade</p>
        <h1>Games</h1>
        <p>Pick a favorite, find something new, and jump right in.</p>
      </div>
      <span class="catalogue-mark games-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7.2 8.5h9.6a4.2 4.2 0 0 1 4.1 3.3l.7 3.1a2.2 2.2 0 0 1-3.6 2.1l-2.1-1.8H8.1L6 17a2.2 2.2 0 0 1-3.6-2.1l.7-3.1a4.2 4.2 0 0 1 4.1-3.3Z"/><path d="M7.5 10.9v3.2m-1.6-1.6h3.2" class="icon-cutout"/><circle cx="16.5" cy="12" r=".8" class="icon-cutout"/><circle cx="18.6" cy="14.1" r=".8" class="icon-cutout"/></svg>
      </span>
    </header>
    <div class="input-container catalogue-toolbar">
      <label class="catalogue-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>
        <input type="search" id="search" onkeyup="bar()" placeholder="Search the arcade" aria-label="Search games" />
        <kbd>/</kbd>
      </label>
      <label class="catalogue-filter">
        <span class="sr-only">Category</span>
        <select id="category" name="category" onchange="category()">
      <option value="all">&#65;&#108;&#108;</option>
      <option value="android">
        &#65;&#110;&#100;&#114;&#111;&#105;&#100;&#32;&#69;&#109;&#117;&#108;&#97;&#116;&#111;&#114;</option>
      <option value="2P">&#77;&#117;&#108;&#116;&#105;&#112;&#108;&#97;&#121;&#101;&#114;</option>
      <option value="sports">&#83;&#112;&#111;&#114;&#116;&#115;</option>
      <option value="flash">&#70;&#108;&#97;&#115;&#104;</option>
      <option value="emu">&#69;&#109;&#117;&#108;&#97;&#116;&#111;&#114;</option>
      <option value="local">&#76;&#111;&#99;&#97;&#108;</option>
        </select>
      </label>
    </div>
    <div class="catalogue-results-line"><span id="catalogue-count">Loading games</span><span>Made for your next break</span></div>
    <div id="apps-container">
      <section class="pinned-section" aria-label="Pinned games">
        <div class="catalogue-section-heading"><h2>Pinned</h2><span>Quick access</span></div>
        <div class="pinned"></div>
      </section>
      <section class="apps-section" aria-label="All games">
        <div class="catalogue-section-heading"><h2>All games</h2><span>Find your next favorite</span></div>
        <div class="apps"></div>
      </section>
      <p class="catalogue-empty-state" id="catalogue-no-results" hidden>No games match that search. Try another name or category.</p>
    </div>
  </main>
  <script src="/assets/js/launcher.js"></script>
</body>

</html>
