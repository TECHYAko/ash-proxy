<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="Ash Proxy — browse the web simply and privately.">
  <title>Ash Proxy</title>
  <link rel="icon" href="/assets/images/branding/favicon/ash.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/ash.css">
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script defer src="/resources/js/index.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Ash Proxy home">
      <img src="/assets/images/branding/favicon/ash.svg" alt="">
      <span>Ash Proxy</span>
    </a>
    <nav aria-label="Main navigation">
      <a class="active" href="/">Browse</a>
      <a href="/ocean">Apps</a>
      <a href="/mathematics">Games</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <main class="home">
    <h1>Browse the web</h1>
    <p>Enter a website address or search with DuckDuckGo.</p>
    <form class="search-form">
      <label class="sr-only" for="searchbar">Website address or search term</label>
      <input id="searchbar" name="url" type="text" autocomplete="off" spellcheck="false"
        placeholder="Search or enter a URL" required>
      <button type="submit">Go</button>
    </form>
  </main>

  <footer class="footer">
    <span>Ash Proxy</span>
    <a href="https://github.com/TECHYAko/ash-proxy" rel="noopener noreferrer">Source</a>
  </footer>
</body>
</html>
